<!DOCTYPE html>
<html lang="ru" data-era="0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>КОМПЬЮТЕРЩИК.EXE</title>
<style>
:root{
  --bg:#141109; --bg2:#0a0806;
  --panel:#1e1811; --panel2:#171208; --panel3:#241d13;
  --line:#3a3025; --line2:#4e4130;
  --ink:#efe3c8; --dim:#a2937a; --mut:#6d6252;
  --acc:#ffb347; --acc2:#8ecb6a;
  --ok:#7fc96a; --bad:#f2777a; --warn:#e8c66b; --ai:#c792ea; --coin:#f6d365;
  --hdr1:#2a2013; --hdr2:#5c421a;
  --mono:ui-monospace,"Cascadia Mono","JetBrains Mono","SF Mono",Consolas,"DejaVu Sans Mono",monospace;
  --ui:"Inter","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --r:11px; --r2:8px;
  /* --hdrH и --actH синхронизируются из JS: шапка и панель активности
     меняют высоту при переносе плашек и кнопок на вторую строку */
  --pad:10px; --hdrH:41px; --actH:52px;
}
html[data-era="1"]{--bg:#0c1015;--bg2:#06090c;--panel:#141a21;--panel2:#101519;--panel3:#1a222b;
  --line:#27323d;--line2:#36444f;--ink:#dbe8f2;--dim:#8798a6;--mut:#5d6b77;--acc:#4fc3f7;--acc2:#8ecb6a;--hdr1:#122130;--hdr2:#1d4664}
html[data-era="2"]{--bg:#0a1213;--bg2:#050b0c;--panel:#111c1e;--panel2:#0d1618;--panel3:#16262a;
  --line:#22383b;--line2:#2f4c50;--ink:#d6ecec;--dim:#82a09f;--mut:#5a7271;--acc:#57d0c4;--acc2:#8ecb6a;--hdr1:#0f2427;--hdr2:#1a5049}
html[data-era="3"]{--bg:#0b1210;--bg2:#050a08;--panel:#111b17;--panel2:#0d1513;--panel3:#17251f;
  --line:#22372e;--line2:#2f4a3e;--ink:#d9ecdf;--dim:#84a292;--mut:#5b7367;--acc:#7ee787;--acc2:#4fc3f7;--hdr1:#0f2419;--hdr2:#1c5230}
html[data-era="4"]{--bg:#0c0d14;--bg2:#06060b;--panel:#14161f;--panel2:#101219;--panel3:#1c1f2b;
  --line:#282c3a;--line2:#383d4f;--ink:#dfe2f2;--dim:#8d92aa;--mut:#62667c;--acc:#8b9dff;--acc2:#7ee787;--hdr1:#161a2c;--hdr2:#333d72}
html[data-era="5"]{--bg:#120e0c;--bg2:#080606;--panel:#1c1613;--panel2:#16110f;--panel3:#261e1a;
  --line:#3a2e28;--line2:#4d3d34;--ink:#f0e2d8;--dim:#a8938a;--mut:#736460;--acc:#ff9e64;--acc2:#7ee787;--hdr1:#2b1c14;--hdr2:#6b3d1f}
html[data-era="6"]{--bg:#0e0b14;--bg2:#07050b;--panel:#17121f;--panel2:#120e19;--panel3:#1f1829;
  --line:#31283f;--line2:#453855;--ink:#e9e0f6;--dim:#9b8db3;--mut:#6d6280;--acc:#c792ea;--acc2:#f5c66b;--hdr1:#1d1430;--hdr2:#4b2b78}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:var(--ui);font-size:12.5px;color:var(--ink);background:var(--bg2);
  background-image:radial-gradient(1100px 520px at 50% -12%,color-mix(in srgb,var(--acc) 9%,var(--bg)),var(--bg2) 72%);
  -webkit-font-smoothing:antialiased}
::selection{background:color-mix(in srgb,var(--acc) 40%,transparent)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--acc) 55%,var(--line2))}

.app{max-width:1420px;margin:0 auto;padding:var(--pad) 12px 16px;display:flex;flex-direction:column;gap:10px}

/* ---------- ХЕДЕР ---------- */
/* top совпадает с отступом .app, поэтому при прилипании шапка не дёргается вверх */
/* Три зоны: бренд слева, часы с деньгами строго по центру, прочее справа.
   Грид, а не флекс: центральная группа держится на середине шапки
   независимо от того, насколько разъехались боковые. */
.hdr{position:sticky;top:var(--pad);z-index:20;
  display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px 14px;
  padding:9px 14px;border-radius:var(--r);border:1px solid var(--line);
  background:linear-gradient(120deg,var(--hdr1),var(--hdr2) 65%,color-mix(in srgb,var(--hdr1) 70%,#000));
  box-shadow:0 6px 22px -12px #000,inset 0 1px 0 rgba(255,255,255,.07)}
.brand{font-weight:700;letter-spacing:.12em;font-size:12.5px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .ext{color:var(--acc);opacity:.85;letter-spacing:.05em}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.pills{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.pills.mid{justify-content:center}
.pills.side{justify-content:flex-end}
/* Часы тикают каждый кадр: моноширинная ширина, чтобы шапка не дёргалась */
.pill.clock b{font-variant-numeric:tabular-nums;letter-spacing:.04em}
.pill.money b{font-variant-numeric:tabular-nums}
@media(max-width:820px){
  .hdr{grid-template-columns:1fr;justify-items:center;text-align:center}
  .pills.mid,.pills.side{justify-content:center}
}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;
  background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.12);font-family:var(--mono);font-size:11px;color:var(--dim)}
.pill b{color:var(--ink);font-weight:600}
.pill.money b{color:var(--coin)}
.pill.money.neg b{color:var(--bad)}
.pill.era{border-color:color-mix(in srgb,var(--acc) 45%,transparent);color:var(--acc)}
.pill.warnp{border-color:color-mix(in srgb,var(--bad) 55%,transparent);color:var(--bad)}
.pill.warnp b{color:var(--bad)}

/* ---------- ПАНЕЛЬ АКТИВНОСТИ ---------- */
/* Липнет сразу под шапкой: чем ты занят и как быстро идёт время — видно всегда */
.actbar{position:sticky;top:calc(var(--pad) + var(--hdrH) + 6px);z-index:19;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:8px 12px;border-radius:var(--r);border:1px solid var(--line);
  background:linear-gradient(180deg,var(--panel3),var(--panel));
  box-shadow:0 8px 24px -18px #000,inset 0 1px 0 rgba(255,255,255,.05)}
.actbar.paused{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.actbar.busy{border-color:color-mix(in srgb,var(--acc) 42%,var(--line))}
.spd{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);flex:none}
.spd button{background:transparent;border-color:transparent;color:var(--dim);
  padding:4px 9px;border-radius:6px;font-family:var(--mono);font-size:10.5px}
.spd button:hover:not(.on){color:var(--ink);transform:none;box-shadow:none;background:rgba(255,255,255,.05)}
.spd button.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 15%,var(--panel3));
  border-color:color-mix(in srgb,var(--acc) 35%,transparent);transform:none}
.spd button.play.on{color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--panel3));
  border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.nowbox{flex:1;min-width:170px;display:flex;flex-direction:column;gap:4px}
.nowline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.nowline b{font-size:12.5px;font-weight:600;color:var(--ink)}
.nowline span{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.nowbar{height:5px;border-radius:99px;background:color-mix(in srgb,var(--line) 75%,#000);overflow:hidden}
.nowbar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 45%,#000),var(--acc));
  transition:width .18s linear}
.actbar.idlenow .nowline b{color:var(--mut);font-weight:500}

/* ---------- СЕТКА ---------- */
.grid{display:grid;grid-template-columns:266px minmax(0,1fr) 336px;gap:10px;align-items:start;flex:1}
@media(max-width:1180px){.grid{grid-template-columns:250px minmax(0,1fr)}.col-r{grid-column:1/-1}}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.panel{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
  box-shadow:0 10px 28px -22px #000,inset 0 1px 0 rgba(255,255,255,.035);padding:12px;min-width:0}
.col-l,.col-r{position:sticky;top:calc(var(--pad) + var(--hdrH) + var(--actH) + 16px)}
@media(max-width:1180px){.col-r{position:static}}
@media(max-width:820px){.col-l{position:static}}
.col-c{min-height:520px}

/* ---------- ТИПОГРАФИКА ---------- */
h3.sec{font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--mut);margin:0 0 8px;
  display:flex;align-items:center;gap:8px;font-weight:700}
h3.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
h3.sec.mt{margin-top:16px}
.hint{font-family:var(--mono);font-size:10.5px;color:var(--dim);line-height:1.7}
.hint b{color:var(--ink);font-weight:600}
.mono{font-family:var(--mono)}
.big{font-family:var(--mono);font-size:17px;color:var(--acc);letter-spacing:.02em}
.mut{color:var(--mut)}

/* ---------- ПОЛОСКИ ---------- */
.row{display:flex;align-items:center;gap:8px;margin:5px 0}
.row .lbl{width:74px;flex:none;color:var(--dim);font-size:11px}
.row .val{width:34px;flex:none;text-align:right;font-family:var(--mono);font-size:11px;color:var(--ink)}
.bar{flex:1;height:7px;border-radius:99px;background:color-mix(in srgb,var(--line) 75%,#000);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .35s cubic-bezier(.4,0,.2,1);
  background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 45%,#000),var(--acc))}
.bar.sk>i{background:linear-gradient(90deg,color-mix(in srgb,var(--acc2) 45%,#000),var(--acc2))}
.bar.mid>i{background:linear-gradient(90deg,#8a6a1f,var(--warn))}
.bar.lo>i{background:linear-gradient(90deg,#7a2a2c,var(--bad))}
.bar.burn>i{background:linear-gradient(90deg,#7a3a1c,#f2913f)}
.bar.big{height:9px}

/* ---------- КНОПКИ ---------- */
button{font-family:var(--ui);font-size:11.5px;font-weight:500;letter-spacing:.01em;cursor:pointer;
  color:var(--ink);background:linear-gradient(180deg,color-mix(in srgb,var(--panel3) 92%,#fff 8%),var(--panel3));
  border:1px solid var(--line2);border-radius:var(--r2);padding:6px 11px;
  transition:transform .12s,border-color .14s,background .14s,box-shadow .14s;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover:not(:disabled){border-color:color-mix(in srgb,var(--acc) 62%,var(--line2));transform:translateY(-1px);
  box-shadow:0 5px 14px -8px color-mix(in srgb,var(--acc) 65%,#000)}
button:active:not(:disabled){transform:translateY(0);filter:brightness(.94)}
button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.pri{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 92%,#fff),color-mix(in srgb,var(--acc) 78%,#000));
  color:#161206;border-color:transparent;font-weight:650}
html[data-era="4"] button.pri,html[data-era="6"] button.pri{color:#0e0a14}
button.dan{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line2))}
button.dan:hover:not(:disabled){border-color:var(--bad);box-shadow:0 5px 14px -8px var(--bad)}
button.gho{background:transparent;color:var(--dim)}
button.gho:hover:not(:disabled){color:var(--ink)}
button.tiny{padding:3px 8px;font-size:10.5px}
button .k{font-family:var(--mono);font-size:10.5px;opacity:.75}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}

/* ---------- ТАБЫ ---------- */
.tabs{display:inline-flex;gap:3px;flex-wrap:wrap;padding:3px;border-radius:10px;
  background:var(--panel2);border:1px solid var(--line);margin-bottom:12px}
.tabs button{background:transparent;border-color:transparent;color:var(--dim);padding:5px 11px;border-radius:7px}
.tabs button:hover:not(.on){color:var(--ink);transform:none;box-shadow:none;background:rgba(255,255,255,.04)}
.tabs button.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 13%,var(--panel3));
  border-color:color-mix(in srgb,var(--acc) 32%,transparent);transform:none}
.tabs button .bdg{font-family:var(--mono);font-size:9.5px;padding:0 4px;border-radius:5px;
  background:color-mix(in srgb,var(--acc) 26%,transparent);color:var(--ink)}

/* ---------- КАРТОЧКИ ---------- */
.card{border:1px solid var(--line);border-radius:var(--r2);background:var(--panel2);padding:10px 11px;margin-bottom:8px;
  transition:border-color .15s}
.card:hover{border-color:var(--line2)}
.card.hl{border-left:3px solid var(--acc);padding-left:9px}
.card.ok{border-left:3px solid var(--ok);padding-left:9px}
.card.warnc{border-left:3px solid var(--warn);padding-left:9px}
.card.badc{border-left:3px solid var(--bad);padding-left:9px}
.card h4{margin:0 0 5px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card .meta{font-family:var(--mono);font-size:10.5px;color:var(--dim);line-height:1.65}
.card .meta b{color:var(--ink);font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}

/* ---------- ЧИПЫ ---------- */
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9.5px;letter-spacing:.03em;
  padding:2px 6px;border-radius:6px;border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);
  color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent);text-transform:uppercase;font-weight:600}
.chip.g{border-color:color-mix(in srgb,var(--ok) 45%,transparent);color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.chip.b{border-color:color-mix(in srgb,var(--bad) 48%,transparent);color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.chip.w{border-color:color-mix(in srgb,var(--warn) 45%,transparent);color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.chip.ai{border-color:color-mix(in srgb,var(--ai) 50%,transparent);color:var(--ai);background:color-mix(in srgb,var(--ai) 10%,transparent)}
.chip.n{border-color:var(--line2);color:var(--mut);background:transparent}

/* ---------- СТРОКИ МАГАЗИНА ---------- */
.srow{display:flex;justify-content:space-between;gap:8px;align-items:center;font-family:var(--mono);font-size:11px;
  padding:5px 2px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.srow:last-child{border-bottom:none}
.srow .nm{flex:1;min-width:0;line-height:1.45}
.srow .nm small{display:block;color:var(--mut);font-size:9.5px;letter-spacing:.02em}
.srow .nm small.no{color:color-mix(in srgb,var(--bad) 80%,var(--dim))}
.srow.cur{background:color-mix(in srgb,var(--acc) 7%,transparent);border-radius:6px;padding:5px 6px}
.own{color:var(--ok);font-family:var(--mono);font-size:10.5px}

/* ---------- ТЕРМИНАЛ ---------- */
.crt{background:var(--panel2);position:relative;overflow:hidden}
.crt::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:var(--r);
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px)}
.ph{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ph h3{margin:0;font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--mut);font-weight:700}
.ph .phx{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--mut)}
.log{height:calc(100vh - var(--hdrH) - var(--actH) - 137px);min-height:280px;overflow-y:auto;font-family:var(--mono);font-size:11px;line-height:1.6;padding-right:4px}
@media(max-width:1180px){.log{height:300px}}
.log>div{margin-bottom:4px;color:var(--dim);display:flex;gap:7px;align-items:baseline}
.log .t{color:var(--mut);flex:none;font-size:9.5px;opacity:.8;padding-top:1px}
.log .m{flex:1}
.log .good .m{color:var(--ok)}.log .bad .m{color:var(--bad)}.log .warn .m{color:var(--warn)}
.log .ai .m{color:var(--ai)}.log .ev .m{color:var(--acc)}.log .money .m{color:var(--coin)}
.caret{display:inline-block;width:6px;height:11px;background:var(--acc);vertical-align:-1px;animation:bl 1.05s steps(1) infinite}
@keyframes bl{50%{opacity:0}}

/* ---------- МОДАЛКА ---------- */
.mask{position:fixed;inset:0;z-index:60;background:rgba(4,3,2,.74);backdrop-filter:blur(4px);
  display:grid;place-items:center;padding:18px;animation:fade .18s}
@keyframes fade{from{opacity:0}}
.modal{width:100%;max-width:480px;border:1px solid var(--line2);border-radius:var(--r);background:var(--panel);
  box-shadow:0 30px 70px -20px #000;overflow:hidden;animation:pop .2s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{transform:translateY(10px) scale(.97);opacity:0}}
.modal .mh{padding:11px 14px;background:linear-gradient(120deg,var(--hdr1),var(--hdr2));
  font-weight:700;font-size:12.5px;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.modal .mb{padding:13px 14px;font-family:var(--mono);font-size:11px;line-height:1.75;color:var(--dim)}
.modal .mo{padding:0 14px 14px;display:flex;flex-direction:column;gap:7px}
.modal .mo button{justify-content:flex-start;text-align:left;padding:9px 11px;white-space:normal;line-height:1.45}
.modal .mo button i{display:block;font-style:normal;font-family:var(--mono);font-size:10px;color:var(--mut);margin-top:3px}

/* ---------- ТОСТ ---------- */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:70;
  background:var(--panel);color:var(--ink);border:1px solid color-mix(in srgb,var(--acc) 50%,var(--line2));
  border-left:3px solid var(--acc);padding:9px 16px;border-radius:var(--r2);font-family:var(--mono);font-size:11.5px;
  box-shadow:0 16px 40px -14px #000;pointer-events:none;animation:up .22s cubic-bezier(.2,1.2,.4,1)}
@keyframes up{from{transform:translate(-50%,14px);opacity:0}}

textarea{width:100%;height:72px;margin-top:8px;background:var(--panel2);color:var(--dim);border:1px solid var(--line);
  border-radius:var(--r2);font-family:var(--mono);font-size:10px;padding:8px;resize:vertical}
.flash{animation:fl .6s}
@keyframes fl{0%{filter:brightness(1.9) saturate(.55)}100%{filter:none}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-family:var(--mono);font-size:10.5px;line-height:1.7}
.kv dt{color:var(--mut)}
.kv dd{margin:0;color:var(--ink);text-align:right}
.kv dd.g{color:var(--ok)}.kv dd.b{color:var(--bad)}.kv dd.w{color:var(--warn)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
 <header class="hdr">
  <div class="brand"><span class="dot"></span>КОМПЬЮТЕРЩИК<span class="ext">.exe</span></div>
  <div class="pills mid" id="hMid"></div>
  <div class="pills side" id="hPills"></div>
 </header>
 <div class="actbar" id="actBar"></div>
 <main class="grid">
  <section class="panel col-l" id="colStats"></section>
  <section class="panel col-c" id="colMain"></section>
  <section class="panel col-r crt">
   <div class="ph"><h3>Терминал</h3><span class="phx" id="logInfo"></span></div>
   <div class="log" id="log"></div>
  </section>
 </main>
</div>
<div id="host"></div>
<script>
"use strict";

/* ==================== УТИЛИТЫ ==================== */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const rf=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;

function tdpOf(r){return rIt(r,"cpu").w+rIt(r,"gpu").w+45;}
function coolCap(r){return rIt(r,"cooler").tdp*rIt(r,"case").air*(has("ac")?1.08:1)*(has("fan")?1.06:1);}
function issues(r){
 r=r||S.rig;
 const mb=rIt(r,"mb"),cpu=rIt(r,"cpu"),ram=rIt(r,"ram"),gpu=rIt(r,"gpu"),dk=rIt(r,"disk"),
       ps=rIt(r,"psu"),cs=rIt(r,"case"),cl=rIt(r,"cooler"),mo=rIt(r,"mon");
 const o=[],mbMax=Math.max(...mb.bus);
 if(!mb.sock.includes(cpu.sock))
  o.push({s:"cpu",hard:1,k:"сокет",m:`${cpu.n} — ${SOCKN[cpu.sock]}, а плата под ${mb.sock.map(x=>SOCKN[x]).join(" / ")}`});
 if(!mb.ram.includes(ram.type))
  o.push({s:"ram",hard:1,k:"тип памяти",m:`${RAMT[ram.type]} не встанет: плата принимает ${mb.ram.map(t=>RAMT[t]).join(" / ")}`});
 if(!mb.bus.includes(gpu.bus)){
  if(gpu.bus>=3&&mbMax>=3){ if(gpu.bus>mbMax)o.push({s:"gpu",hard:0,k:"шина",m:`${BUSN[gpu.bus]}-карта в слоте ${BUSN[mbMax]}: минус 7% мощности`}); }
  else o.push({s:"gpu",hard:1,k:"слот видео",m:`${BUSN[gpu.bus]}-карта не встанет: у платы ${mb.bus.map(b=>BUSN[b]).join(" / ")}`});
 }
 if(dk.if<mb.dmin)o.push({s:"disk",hard:1,k:"интерфейс",m:`${IFN[dk.if]} эта плата уже не поддерживает`});
 if(dk.if>mb.dmax)o.push({s:"disk",hard:1,k:"интерфейс",m:`Плата не умеет ${IFN[dk.if]} (максимум ${IFN[mb.dmax]})`});
 if(cs.form<mb.form)o.push({s:"case",hard:1,k:"типоразмер",m:`Плата ${FORMN[mb.form]} не влезет в корпус под ${FORMN[cs.form]}`});
 if(gpu.len>cs.gpu)o.push({s:"case",hard:1,k:"габариты",m:`Карта ${gpu.len} мм не влезает: в корпус входит ${cs.gpu} мм`});
 if(gpu.pg>ps.pg)o.push({s:"psu",hard:1,k:"разъёмы",m:`У блока нет питания для этой карты (нужен ${["без доп. питания","6/8-pin","2×8-pin","12VHPWR"][gpu.pg]})`});
 const td=tdpOf(r);
 if(td>ps.w)o.push({s:"psu",hard:0,k:"ватты",m:`Потребление ${td} Вт против ${ps.w} Вт: выключения и риск хлопка`});
 else if(td>ps.w*.88)o.push({s:"psu",hard:0,k:"ватты",m:`Блок на пределе: ${td} из ${ps.w} Вт`});
 if(cpu.w>coolCap(r))o.push({s:"cooler",hard:0,k:"нагрев",m:`Кулер держит ${Math.round(coolCap(r))} Вт, процессор просит ${cpu.w}: троттлинг`});
 if(mo.need>gpu.pw)o.push({s:"mon",hard:0,k:"видео",m:`Видеокарта не раскрывает монитор: комфорт ниже`});
 return o;
}

function platformParts(pf){
 const out=[];
 for(const k in pf.set){
  const cIdx=HW[k].items.findIndex(x=>x.id===S.rig[k]);
  const nIdx=HW[k].items.findIndex(x=>x.id===pf.set[k]);
  if(nIdx>cIdx)out.push({sl:k,id:pf.set[k]});
 }
 return out;
}
function platformPrice(pf){
 const ps=platformParts(pf);
 const gross=sum(ps.map(x=>hwPrice(item(x.sl,x.id))));
 const back=sum(ps.map(x=>Math.round(item(x.sl,S.rig[x.sl]).p*.35)));
 return{gross:Math.round(gross*.92),back,net:Math.round(gross*.92)-back,parts:ps};
}

/* ==================== ПРОИЗВОДНЫЕ ==================== */
function throttle(){
 const c=cur("cpu").w,cap=coolCap(S.rig);
 return c>cap?clamp(cap/c,.62,1):1;
}
function busPen(){
 const mb=cur("mb"),g=cur("gpu"),mx=Math.max(...mb.bus);
 return(!mb.bus.includes(g.bus)&&g.bus>mx)?.93:1;
}
function power(){
 const raw=cur("cpu").pw*.5+cur("ram").pw*.26+cur("disk").pw*.16+cur("gpu").pw*.08;
 return raw*throttle()*busPen();
}
function monK(){return cur("mon").need>cur("gpu").pw?.62:1;}
function comfort(){
 const base=(cur("mon").cf*monK()+cur("chair").cf+cur("kb").cf+HOMES[S.home].cf)/4;
 return clamp(base+(has("lamp")?.04:0)+(has("desk")?.06:0),0,1);
}
function tdp(){return tdpOf(S.rig);}
function overload(){return tdp()>cur("psu").w;}
function broken(){return issues().some(x=>x.hard);}
function localAI(){return has("llm")&&cur("gpu").vr>=8;}
function cond(){
 const n=S.needs;
 let f=.24+.42*(n.energy/100)+.2*(n.mood/100)+.14*(n.health/100);
 if(n.food<25)f*=.8; if(n.food<10)f*=.72; if(n.hygiene<20)f*=.93;
 if(n.health<35)f*=.5+.5*(n.health/35);   /* разваливаться — дорого */
 f*=1-S.burn/240;
 if(S.sick>0)f*=.68;
 if(S.coffee>0)f*=1.14;
 return clamp(f,.1,1.12);
}
function skEff(p){return p.sk2?S.sk[p.sk]*.7+S.sk[p.sk2]*.3:S.sk[p.sk];}
function speed(p){
 if(broken())return 0;
 const skF=.55+1.15*Math.pow(clamp(skEff(p),0,100)/100,.75);
 const rigF=.65+.95*Math.sqrt(clamp(power(),0,190)/130);
 const foc=(has("cans")?1.1:1)*(has("lamp")?1.03:1);
 const tb=(has("tablet")&&(p.sk==="design"||p.sk2==="design"))?1.12:1;
 return 9*rigF*skF*cond()*foc*tb*cur("kb").ty*(S.buff.fast>0?1.12:1);
}
function bugRate(p){
 const s=S.sk[p.sk];
 return p.bug*(1.45-s/85)*(1+(100-S.needs.mood)/280)*(S.needs.energy<25?1.5:1)*(1+S.burn/300);
}
function maxActive(){return 2+(S.sk.biz>=35?1:0)+(S.sk.biz>=70?1:0);}
function payRate(o){return o.r*INFL[eraIdx()]/INFL[o.e];}
function passiveTotal(){return sum(S.passive.map(p=>pInc(p)));}
function pInc(p){
 return Math.round(p.base*(.35+.65*p.hp/100)*(1+S.followers/14000)*(has("server")?1.1:1));
}
function netWorth(){return S.money+S.dep+sum(ASSETS.map(a=>S.mk[a.id].q*S.mk[a.id].p))-S.debt;}

 v=Math.round(v);S.money+=v;S.earned+=v;S.periodEarned+=v;
 if(why)log(`${why} +${money(v)}.`,cls||"money");
}
function pay(v){v=Math.round(v);S.money-=v;S.spent+=v;}
function afford(v){return S.money>=v;}

/* ==================== ВРЕМЯ ==================== */
/* Отдача от опыта падает с уровнем. Делитель подобран под длину игры:
   с растянутыми эпохами навык не должен упираться в 100 к середине. */
function xp(k,v){S.sk[k]=clamp(S.sk[k]+v/(1+S.sk[k]/6.5),0,100);}

/* ==================== ВРЕМЯ: РЕАЛТАЙМ ====================
   Часы идут сами. SEC_HOUR — сколько реальных секунд в игровом часе
   на скорости ×1: сутки при ×1 занимают ~72 с, при ×8 — девять секунд. */
const SEC_HOUR=3, SPEEDS=[1,2,4,8];
const gt=()=>(S.day-1)*24+S.hour;   /* абсолютное игровое время в часах */

/* Полночь просто переводит день. Работать ночью можно — наказывает за это
   не календарь, а падающая энергия (см. collapse). */
function rollDays(){
 let guard=0;
 while(S.hour>=24&&guard++<40){S.hour-=24;endDay();}
}
function tickClock(h){
 S.coffee=Math.max(0,S.coffee-h);
 S.hour+=h;
 rollDays();
}
function advance(h,intensity){
 intensity=intensity==null?1:intensity;
 const n=S.needs,c=1-comfort()*.32;
 n.energy=clamp(n.energy-h*3.4*intensity*c,0,100);
 n.food=clamp(n.food-h*2.9,0,100);
 n.hygiene=clamp(n.hygiene-h*2.1,0,100);
 n.mood=clamp(n.mood-h*1.25*intensity+(has("cat")?.28*h:0),0,100);
 if(intensity>=.9)S.burn=clamp(S.burn+h*intensity*.44,0,100);
 else S.burn=clamp(S.burn-h*.55,0,100);
 tickClock(h);
}
/* Мгновенная трата времени: покупки, переезд, сдача проекта, события.
   Дело сделано сразу, а часы списываются разом. */
function spend(h,intensity){advance(h,intensity==null?.6:intensity);}
function lose(h){
 S.hour+=h;
 S.needs.energy=clamp(S.needs.energy-h*3,0,100);
 S.needs.food=clamp(S.needs.food-h*2.5,0,100);
 rollDays();
}

/* ==================== АКТИВНОСТИ ====================
   S.act — чем игрок занят прямо сейчас:
     idle           бездельничает
     work           пишет код (бесконечная, прогресс капает каждый кадр)
     debug          чинит баги (бесконечная)
     sleep          спит (пока не выспится)
     timed + t      дело фиксированной длины из TIMED; эффект срабатывает
                    в конце, деньги списываются в начале.
   Прерванное timed-дело эффекта не даёт — потраченного не вернуть. */
function proj(id){return S.active.find(x=>x.id===id);}
function actInt(){
 const a=S.act;
 if(a.k==="sleep")return 0;
 if(a.k==="idle")return .35;
 if(a.k==="debug")return 1.2;
 if(a.k==="work")return({norm:1.15,care:1.3,vibe:.82})[a.mode]||1.15;
 if(a.k==="timed")return TIMED[a.t]?TIMED[a.t].int:.6;
 return 1;
}
function actLabel(){
 const a=S.act;
 if(a.k==="idle")return "Ничего не делаешь";
 if(a.k==="sleep")return "Спишь";
 if(a.k==="work"){
  const p=proj(a.id);
  return `${({norm:"Кодишь",care:"Пишешь аккуратно",vibe:"Вайбкодишь"})[a.mode]||"Кодишь"} над «${p?p.n:"—"}»`;
 }
 if(a.k==="debug"){const p=proj(a.id);return `Отладка «${p?p.n:"—"}»`;}
 if(a.k==="timed"){const T=TIMED[a.t];return T?(typeof T.n==="function"?T.n(a.pl):T.n):"Занят";}
 return "Занят";
}
/* Подпись справа от названия: сколько осталось или на чём стоим */
function actSub(){
 const a=S.act;
 if(a.k==="timed")return `осталось ${a.left.toFixed(1)} ч`;
 if(a.k==="sleep")return `спит ${(a.slept||0).toFixed(1)} ч`;
 if(a.k==="work"||a.k==="debug"){
  const p=proj(a.id);if(!p)return "";
  return a.k==="debug"?`багов ${p.bugs}`:`${Math.round(p.prog/p.w*100)}% · багов ${p.bugs}`;
 }
 return "";
}
function actProgress(){
 const a=S.act;
 if(a.k==="timed"&&a.total)return clamp((1-a.left/a.total)*100,0,100);
 if(a.k==="sleep")return clamp((S.needs.energy/97)*100,0,100);
 if(a.k==="work"){const p=proj(a.id);return p?clamp(p.prog/p.w*100,0,100):0;}
 if(a.k==="debug"){const p=proj(a.id);return p&&a.bugs0?clamp((1-p.bugs/a.bugs0)*100,0,100):0;}
 return 0;
}
function setAct(a){S.act=a;needRender=true;}
function idle(){setAct({k:"idle"});}
function startTimed(t,pl){
 const T=TIMED[t];if(!T)return;
 const h=typeof T.h==="function"?T.h(pl):T.h;
 setAct({k:"timed",t,pl:pl==null?null:pl,left:h,total:h});
}
function startSleep(forced){
 setAct({k:"sleep",slept:0});
 if(!forced)log("Лёг спать.","");
}

/* --- шаги активностей: то же, что раньше делала кнопка «N часов»,
       только размазанное по времени --- */
function stepWork(h,a){
 const p=proj(a.id);if(!p)return;
 let sp=speed(p),br=bugRate(p);
 if(a.mode==="vibe"){
  const q=S.aiSub?1:.66;
  sp*=(1.7+S.sk.prompt/75)*q; br*=(3.4-S.sk.prompt/48)*1.5;
  p.vibe+=h;
  if(!S.aiSub&&!localAI()){
   S.aiAcc=(S.aiAcc||0)+h*7*inf();
   const due=Math.floor(S.aiAcc);
   if(due>0){S.aiAcc-=due;pay(due);S.aiSpent+=due;}
  }
 }
 if(a.mode==="care"){sp*=.62;br*=.26;}
 p.prog=Math.min(p.w,p.prog+sp*h);
 /* Баги копятся дробно. Множитель 1.1 — среднее от прежнего rf(.6,1.6),
    так что за те же часы их набегает столько же, сколько в пошаговой версии. */
 p._bf=(p._bf||0)+br*h*1.1;
 while(p._bf>=1){p._bf-=1;p.bugs++;}
 xp(p.sk,h*(a.mode==="vibe"?.4:.8));
 if(p.sk2)xp(p.sk2,h*(a.mode==="vibe"?.22:.45));
 if(a.mode==="vibe")xp("prompt",h*1.1);
}
function stepDebug(h,a){
 const p=proj(a.id);if(!p||p.bugs<=0)return;
 p._df=(p._df||0)+h*(1.15+S.sk.algo/26)*cond();
 while(p._df>=1&&p.bugs>0){p._df-=1;p.bugs--;}
 xp("algo",h*.6);xp("code",h*.3);
}
function stepSleep(h){
 const b=(1+(has("bed")?.15:0)+(has("matt")?.15:0))*HOMES[S.home].sl;
 S.needs.energy=clamp(S.needs.energy+h*8.6*b,0,100);
 S.needs.mood=clamp(S.needs.mood+h*1.05,0,100);
 S.needs.food=clamp(S.needs.food-h*1.1,0,100);
 S.needs.hygiene=clamp(S.needs.hygiene-h*.8,0,100);
 S.burn=clamp(S.burn-h*(.75+S.burn*.02*b),0,100);
 S.act.slept=(S.act.slept||0)+h;
 tickClock(h);
}
/* Один шаг мира на h игровых часов */
function stepAct(h){
 const a=S.act;
 if(a.k==="sleep"){stepSleep(h);return;}
 if(a.k==="work")stepWork(h,a);
 else if(a.k==="debug")stepDebug(h,a);
 advance(h,actInt());
 if(a.k==="timed"&&S.act===a){
  a.left-=h;
  if(a.left<=0){const t=a.t,pl=a.pl;idle();TIMED[t].done(pl);}
 }
}
/* Силы кончились — вырубает прямо за машиной. Раньше это делала полночь. */
function collapse(){
 if(S.needs.energy>.5||S.act.k==="sleep")return false;
 log("Ты вырубился прямо за клавиатурой. Спина этого не забудет.","bad");
 S.needs.health=clamp(S.needs.health-4,0,100);
 S.needs.mood=clamp(S.needs.mood-8,0,100);
 S.burn=clamp(S.burn+6,0,100);
 startSleep(true);
 return true;
}
/* Проверки после каждого шага: доделанное, кончившееся, наступившее */
function afterStep(){
 const a=S.act;
 if(collapse())return true;
 if(a.k==="sleep"&&(S.needs.energy>=97||(a.slept||0)>=12)){
  log(`Проснулся. Спал ${(a.slept||0).toFixed(1)} ч.`,"good");
  idle();return true;
 }
 if(a.k==="work"||a.k==="debug"){
  const p=proj(a.id);
  if(!p){idle();return true;}
  if(a.k==="work"&&p.prog>=p.w){
   log(`«${p.n}» готов. Багов: ${p.bugs}.`,"good");toast("Проект готов");
   idle();return true;
  }
  if(a.k==="debug"&&p.bugs<=0){log(`Багов в «${p.n}» не осталось.`,"good");idle();return true;}
 }
 if(gt()>=S.nextEv){scheduleEv();event();needRender=true;return true;}
 /* Отошёл от машины, а персонаж сидит без дела и голодает — время само
    встаёт на паузу, чтобы вернуться не к трупу. */
 if(a.k==="idle"&&S.speed>0&&(S.needs.food<12||S.needs.energy<12)){
  S.speed=0;
  log("Пауза: ты ничего не делаешь, а силы и сытость на нуле.","warn");
  toast("Пауза — пора поесть или поспать");
  needRender=true;return true;
 }
 return false;
}
function scheduleEv(){S.nextEv=gt()+rf(20,60);}   /* в среднем ~0.6 события в сутки, как было */
function endDay(){
 S.day++;
 const n=S.needs;
 /* --- здоровье --- */
 let hd=cur("chair").hp+(has("desk")?1:0)+HOMES[S.home].md*.35;

/* Всё, что ещё не вышло, в интерфейсе скрыто — поэтому о новинках сообщаем в терминал */
function newStuff(from,to){
 const out=[];
 SLOTS.forEach(sl=>HW[sl].items.forEach(it=>{if(it.y>from&&it.y<=to)out.push(it.n);}));
 PLATFORMS.forEach(p=>{if(p.y>from&&p.y<=to)out.push(`комплект «${p.n}»`);});
 PERKS.forEach(p=>{if(p.y>from&&p.y<=to)out.push(p.n);});
 BOOKS.forEach(b=>{if(b.y>from&&b.y<=to)out.push(b.n);});
 HOMES.forEach(x=>{if(x.y>from&&x.y<=to)out.push(x.n);});
 ASSETS.forEach(a=>{if(a.y>from&&a.y<=to)out.push(a.n);});
 FOOD.forEach(f=>{if(f.y>from&&f.y<=to)out.push(f.n);});
 if(from<2023&&to>=2023)out.push("подписка на ИИ-ассистента");
 return out;
}
function checkYear(){
 const yr=gYear();
 if(yr<=S.seenYear)return;
 const nw=newStuff(S.seenYear,yr);
 S.seenYear=yr;
 if(!nw.length)return;
 const head=nw.slice(0,6).join(", ");
 log(`${yr}: появилось в продаже — ${head}${nw.length>6?` и ещё ${nw.length-6} поз.`:""}.`,"ev");
}
function bills(){
 const H=HOMES[S.home];
 const rent=Math.round(H.rent*inf());
 const el=Math.round(tdp()*.035*inf()*(has("ac")?1.3:1));
 const nt=Math.round(cur("net").fee*inf()/1.2);
 const sub=S.aiSub?Math.round(S.aiFee*inf()/2):0;
 const life=Math.round((6+eraIdx()*3)*inf());
 let intr=0;
 if(S.debt>0){intr=Math.round(S.debt*.028);S.debt+=intr;}
 const total=rent+el+nt+sub+life;
 pay(total);
 const parts=[`жильё ${money(rent)}`,`свет ${money(el)}`,`связь ${money(nt)}`,`мелочи ${money(life)}`];
 if(sub)parts.push(`ИИ ${money(sub)}`);
 if(intr)parts.push(`проценты по кредиту ${money(intr)}`);
 log(`Счета за неделю: ${parts.join(", ")}. Итого ${money(total)}.`,"warn");
 if(S.dep>0){const d=Math.round(S.dep*.007);S.dep+=d;}
 if(S.money<0){
  const need=Math.ceil(-S.money/100)*100+100;
  S.debt+=need;S.money+=need;
  log(`Денег не хватило. Пришлось занять ${money(need)} под 5% в неделю.`,"bad");
  S.needs.mood=clamp(S.needs.mood-10,0,100);
 }
}
function taxes(){
 if(S.periodEarned<=0){S.periodEarned=0;return;}
 const rate=.06+eraIdx()*.025;
 const turn=S.periodEarned,t=Math.round(turn*rate);
 pay(t);S.periodEarned=0;
 log(`Налоги за месяц: ${money(t)} — ${Math.round(rate*100)}% с оборота ${money(turn)}. Вечер в личном кабинете.`,"warn");
}

/* ==================== ПРЕДЛОЖЕНИЯ ==================== */
function refreshOffers(paid){
 const e=eraIdx();
 let pool=JOBS.filter(j=>j.e<=e&&j.e>=e-2&&(!j.min||S.sk[j.sk]>=j.min*.75));
 if(pool.length<4)pool=JOBS.filter(j=>j.e<=e);
 const prods=PRODUCTS.filter(j=>j.e<=e&&j.e>=e-2);
 const n=3+(S.rep>40?1:0)+(S.rep>70?1:0)+(paid?2:0);
 S.offers=[];
 for(let i=0;i<n;i++){
  const t=pick(pool);
  const mult=(.82+Math.random()*.42+S.rep/240+S.followers/60000)*(paid?1.12:1);
  const w=Math.round(t.w*rf(.85,1.2));
  S.offers.push({...t,id:uid(),w,pay:Math.round(w*payRate(t)*mult),type:"job"});
 }
 if(prods.length&&chance(.8)){
  const t=pick(prods);
  S.offers.push({...t,id:uid(),type:"prod",w:Math.round(t.w*rf(.9,1.1))});
 }
}

function pickEvent(){
 const e=eraIdx(),pool=[];
 EV.forEach(ev=>{
  if(ev.to!=null&&e>ev.to)return;
  if(ev.fr!=null&&e<ev.fr)return;
  if(ev.if&&!ev.if())return;
  for(let i=0;i<ev.w;i++)pool.push({k:null,f:ev.f});
 });
 for(const k in ASK){
  const a=ASK[k];
  if(a.to!=null&&e>a.to)continue;
  if(a.fr!=null&&e<a.fr)continue;
  if(a.if&&!a.if())continue;
  for(let i=0;i<a.w;i++)pool.push({k});
 }
 return pool.length?pick(pool):null;
}
function event(){
 const x=pickEvent();if(!x)return;
 if(x.k)S.pending=x.k; else x.f();
}
function resolveAsk(i){
 const a=ASK[S.pending];S.pending=null;
 if(a&&a.o[i])a.o[i].f();
 check();render();
}

function hire(id,hid){
 const p=S.active.find(x=>x.id===id);if(!p)return;
 const H=HIRES.find(x=>x.id===hid);if(!H)return;
 if(S.sk.biz<H.biz){toast(`Нужен бизнес ${H.biz}`);return;}
 p.hires=p.hires||[];
 if(p.hires.length>=2){toast("Больше двух человек на проект не нужно");return;}
 if(p.hires.includes(hid)){toast("Уже работает");return;}
 const base=p.type==="prod"?p.inc*18:p.pay;
 const c=Math.round(base*H.cost);
 if(!afford(c)){toast("Не хватает денег на подрядчика");return;}
 pay(c);p.hires.push(hid);S.hired=true;xp("biz",1.2);
 log(`Взял на «${p.n}»: ${H.n} за ${money(c)}. Работает сам, каждый день.`,"ev");

}
function ship(id){
 const p=S.active.find(x=>x.id===id);if(!p)return;
 if(p.prog<p.w){toast("Ещё не готово");return;}
 const q=clamp(1-p.bugs*.055,.25,1);
 S.active=S.active.filter(x=>x.id!==id);S.shipped++;
 if(p.type==="prod"){
  const base=Math.round(p.inc*q*(1+S.rep/180));
  S.passive.push({n:p.n,base,hp:100,sk:p.sk,sk2:p.sk2});
  S.rep=clamp(S.rep+p.rep*q,0,100);S.followers+=Math.round(p.rep*ri(25,110)*q);
  log(`Выпущен «${p.n}»! Приносит около ${money(base)} в день. Багов на релизе: ${p.bugs}.`,"good");
 }else{
  let v=p.pay*q*(p.late?.62:1);
  if(p.bugs===0)v*=1.12;
  if(p.equity){
   const sh={n:p.n,val:Math.round(p.pay*rf(2.5,9)),day:S.day+ri(35,80)};
   S.equity.push(sh);
   log(`Сдал «${p.n}» за долю. Оплата символическая, но у тебя есть бумага.`,"ev");
  }
  earn(v,`Сдал «${p.n}» (качество ${Math.round(q*100)}%):`,"money");
  const dr=p.bugs>10?-3:(p.bugs===0?p.rep*1.3:p.rep*q)*(1-S.rep/108);
  S.rep=clamp(S.rep+dr,0,100);
  log(`Репутация ${dr>=0?"+":""}${dr.toFixed(1)}.`,dr>=0?"good":"bad");
  if(p.bugs>10)log("Заказчик нашёл всё, что не нашёл ты. Часть денег удержали.","bad");
  if(p.risk&&chance(p.risk)){
   const f=Math.round(p.pay*rf(.8,1.8));pay(f);S.rep=clamp(S.rep-7,0,100);
   log(`По «${p.n}» пришли вопросы, которых ты не хотел. Минус ${money(f)} и репутация.`,"bad");
  }
  if(p.bugs<=1&&S.rep>18&&chance(.4)){
   const c={n:p.n,weekly:Math.round(p.pay*.12),left:ri(60,120)};
   S.contracts.push(c);
   log(`Заказчик предложил контракт на поддержку: ${money(c.weekly)} в неделю.`,"good");
  }
 }
 if(p.vibe>0)S.vibeShipped=true;
 if(p.bugs===0)S.cleanShip=true;
 if((S.act.k==="work"||S.act.k==="debug")&&S.act.id===id)idle();
 mood(11);spend(1,.8);check();render();
}

function borrow(){

 if(S.debt+a>maxLoan()){toast("Лимит по кредиту исчерпан");return;}
 S.debt+=a;S.money+=a;
 log(`Взял кредит ${money(a)} под 2.8% в неделю. Долг: ${money(S.debt)}.`,"warn");render();
}
function repay(){
 if(S.debt<=0){toast("Долгов нет");return;}
 const a=Math.min(S.money,S.debt);
 if(a<=0){toast("Платить пока нечем");return;}
 S.money-=a;S.debt-=a;
 if(S.debt<=0)S.paidOff=true;
 log(S.debt<=0?`Кредит закрыт полностью. ${money(a)} и свобода.`:`Погасил ${money(a)}. Остаток долга ${money(S.debt)}.`,S.debt<=0?"good":"");
 check();render();
}
function deposit(v){
 if(v>0){if(!afford(v)){toast("Столько нет");return;}S.money-=v;S.dep+=v;log(`Положил ${money(v)} на депозит (0.7% в неделю).`,"");}
 else{const a=Math.min(S.dep,-v);if(a<=0){toast("На депозите пусто");return;}S.dep-=a;S.money+=a;log(`Снял ${money(a)} с депозита.`,"");}
 check();render();
}
function trade(id,dir){
 const a=ASSETS.find(x=>x.id===id),m=S.mk[id];
 if(gYear()<a.y){toast("Этого пока не существует");return;}
 if(dir>0){
  const budget=Math.floor(S.money*.25);
  const q=Math.floor(budget/m.p);
  if(q<1){toast("Не хватает даже на одну единицу");return;}
  const c=Math.round(q*m.p*1.01);pay(c);m.q+=q;S.mkProfit-=c;
  log(`Купил ${q} ${a.n.toLowerCase()} по ${money(m.p)}. Потрачено ${money(c)}.`,"");
 }else{
  if(m.q<1){toast("Нечего продавать");return;}
  const v=Math.round(m.q*m.p*.99);
  earn(v,`Продал ${m.q} ${a.n.toLowerCase()} по ${money(m.p)}:`,"money");
  S.mkProfit+=v;m.q=0;
 }
 check();render();
}

/* ==================== ДЕЛА С ФИКСИРОВАННОЙ ДЛИТЕЛЬНОСТЬЮ ====================
   h — сколько игровых часов занимает, int — насколько выматывает,
   n — что показывать в строке активности, done — что происходит в конце.

   если довести до конца: бросил на середине — потратил время впустую. */
const TIMED={
 eat:{int:.4,
  n:pl=>`Ешь: ${FOOD[pl].n.toLowerCase()}`,
  h:pl=>{let t=FOOD[pl].t;if(has("micro")&&t>=1)t=Math.max(.25,t-.75);return Math.max(.25,t);},
  done(pl){const f=FOOD[pl];
   S.needs.food=clamp(S.needs.food+f.f,0,100);mood(f.m);hp(f.h);
   log(`${f.n}. −${money(fp(f))}.`);}},
 nap:{n:"Дремлешь",h:1,int:.25,
  done(){en(13);S.burn=clamp(S.burn-1.5,0,100);log("Прикорнул на час.");}},
 shower:{n:"В душе",h:.5,int:.3,
  done(){S.needs.hygiene=100;mood(4);log("Душ. Мир снова терпим.");}},
 walk:{n:()=>has("bike")?"Катаешься по городу":"Гуляешь",h:1.5,int:.4,
  done(){const k=has("bike")?1.4:1;
   mood(15*k);hp(1.5*k);S.burn=clamp(S.burn-4*k,0,100);
   log(has("bike")?"Покатался по городу без телефона. Помогает.":"Прогулка без телефона. Помогает.","good");}},
 gym:{n:"Тренируешься",h:1.5,int:1,
  done(){const k=has("dumb")?2:1;
   hp(4*k);mood(6);en(-18);
   S.needs.hygiene=clamp(S.needs.hygiene-25,0,100);
   S.burn=clamp(S.burn-5,0,100);
   log("Тренировка. Тело удивлено, но благодарно.","good");}},
 /* Толерантность к кофеину: каждая следующая чашка за день бодрит вдвое хуже
    и бьёт по здоровью сильнее. Пятая — это уже не про энергию. */
 coffee:{n:"Пьёшь кофе",h:.25,int:.2,
  done(){
   if(S.coffeeDay!==S.day){S.coffeeDay=S.day;S.coffeeN=0;}
   const k=Math.pow(.55,S.coffeeN);
   en(15*k);hp(-(has("kettle")?.4:.9)*(1+S.coffeeN*.6));
   S.coffeeN++;S.coffee=Math.max(S.coffee,3);
   log(S.coffeeN>3?"Ещё чашка. Руки подрагивают, бодрее уже не становится.":"Кофе. Следующие три часа мир ускоряется.",S.coffeeN>3?"warn":"");}},
 party:{n:"Вечер с друзьями",h:5,int:.6,
  done(){mood(29);en(-25);hp(-2);S.burn=clamp(S.burn-9,0,100);
   log("Вечер с друзьями. Утром будет тяжело, но сейчас хорошо.","good");}},
 doc:{n:"У врача",h:3,int:.5,
  done(){hp(13);S.sick=0;
   log("Сходил к врачу: анализы, укол, лекции о режиме. Стало заметно лучше.","good");}},
 backup:{n:"Делаешь бэкап",h:1,int:.6,
  done(){S.backupDay=S.day;log("Бэкап на второй диск сделан. Спится спокойнее.","good");}},
 study:{n:pl=>`Учишь: ${SKILLS[pl].toLowerCase()}`,h:3,int:1.1,

   xp(pl,2.6*b*cond());mood(-3);

 browse:{n:"Читаешь и копаешься",h:1.5,int:.5,

   xp(sk,1.4);mood(3);

 answers:{n:"Помогаешь в комментариях",h:1.5,int:.9,

 blog:{n:"Пишешь статью",h:2.5,int:1,

 stream:{n:"Стримишь кодинг",h:3,int:1,
  done(){const d=Math.round(S.followers*ri(1,5)/900*inf())+ri(0,4);
   earn(d,"Стримил кодинг 3 ч. Донаты:","money");

 video:{n:"Пишешь и монтируешь видео",h:5,int:1.1,

 course:{n:"Записываешь мини-курс",h:4,int:1,
  done(){const v=Math.round((S.followers*rf(.02,.08)+20)*inf());

 meetup:{n:"На конференции",h:()=>has("bike")?6:7,int:.9,

 shift:{n:()=>S.job?`Смена: ${S.job.n}`:"На работе",h:8,int:1.05,

 gig:{n:pl=>`Халтура: ${pl}`,h:1,int:1.15,
  done(pl){
   if(S.gigDay!==S.day){S.gigDay=S.day;S.gigN=0;}
   const fade=Math.pow(.65,S.gigN);
   const v=Math.max(1,Math.round((rf(2,4.5)+Math.sqrt(Math.max(0,S.sk.hw))*.7+S.rep*.05)*inf()*fade));
   earn(v,`Час халтуры (${pl}):`,"money");
   S.gigN++;
   if(S.gigN===2)log("Больше мелочи по знакомым на сегодня нет — что осталось, платят неохотно.","warn");
   xp("hw",.12);mood(-1.5);}},
 upd:{n:pl=>`Обновляешь «${S.passive[pl]?S.passive[pl].n:"продукт"}»`,h:4,int:1.05,
  done(pl){
   const p=S.passive[pl];if(!p)return;

};

/* ==================== СОХРАНЕНИЕ ==================== */
const KEY="kompsim3";
async function store(v){
 try{if(window.storage){await window.storage.set(KEY,v);return true;}}catch(e){}
 try{localStorage.setItem(KEY,v);return true;}catch(e){}
 return false;
}
async function load(){
 try{if(window.storage){const r=await window.storage.get(KEY);if(r&&r.value)return r.value;}}catch(e){}
 try{const r=localStorage.getItem(KEY);if(r)return r;}catch(e){}
 return null;
}
async function autosave(){try{await store(JSON.stringify(S));}catch(e){}}
async function saveGame(){
 const ok=await store(JSON.stringify(S));
 const ta=document.getElementById("saveBox");
 if(ta)ta.value=JSON.stringify(S);
 toast(ok?"Сохранено":"Хранилище недоступно — скопируй текст ниже");
}
async function loadGame(){
 const ta=document.getElementById("saveBox");
 if(ta&&ta.value.trim()){
  try{const o=JSON.parse(ta.value);if(o.ver!==VER)throw 0;S=o;repair();toast("Загружено из текста");render();return;}
  catch(e){toast("Текст сохранения не читается");return;}
 }
 const r=await load();
 if(!r){toast("Сохранения нет");return;}
 try{const o=JSON.parse(r);if(o.ver!==VER)throw 0;S=o;repair();toast("Загружено");render();}
 catch(e){toast("Сохранение от старой версии");}
}
function reset(){
 S=fresh();refreshOffers();
 log("Новая жизнь. Старый компьютер, немного денег и очень много времени.","ev");
 document.documentElement.dataset.era=0;render();
}

/* ==================== РЕНДЕР: ХЕЛПЕРЫ ==================== */
function B(o){
 return `<button data-act="${o.act}"${o.a!=null?` data-a="${esc(o.a)}"`:""}${o.b!=null?` data-b="${esc(o.b)}"`:""}`+
  ` class="${o.cls||""}"${o.dis?" disabled":""}${o.ttl?` title="${esc(o.ttl)}"`:""}>${o.t}</button>`;
}
function bar(label,v,cls){
 const c=v<25?"lo":v<50?"mid":"";
 return `<div class="row"><span class="lbl">${label}</span><span class="bar ${cls||""} ${cls==="burn"?"":c}">`+
  `<i style="width:${clamp(v,0,100)}%"></i></span><span class="val">${Math.round(v)}</span></div>`;
}
function pbar(v){return `<span class="bar big"><i style="width:${clamp(v,0,100)}%"></i></span>`;}
/* Подсветка кнопки того дела, которым игрок занят прямо сейчас */
function busyOn(k,id,mode){
 const a=S.act;
 if(a.k!==k)return false;
 if(id!=null&&a.id!==id)return false;
 if(mode!=null&&a.mode!==mode)return false;
 return true;
}
function busyTimed(t){return S.act.k==="timed"&&S.act.t===t;}

/* ==================== ПАНЕЛЬ АКТИВНОСТИ ==================== */

 el.className="actbar"+(S.speed===0?" paused":"")+(idleNow?" idlenow":" busy");

/* Обновление того, что меняется каждый кадр. Кнопки не перерисовываются,
   иначе по ним нельзя было бы попасть мышью. */
function liveUpdate(){
 renderHead();
 const nb=document.getElementById("statNeeds");
 if(nb)nb.innerHTML=needsHTML();
 const an=document.getElementById("actName"),as=document.getElementById("actSub"),ap=document.getElementById("actProg");
 if(an)an.textContent=actLabel();
 if(as)as.textContent=actSub();
 if(ap)ap.style.width=actProgress()+"%";
 if(tab==="work")S.active.forEach(p=>{
  const b=document.getElementById("pb-"+p.id),t=document.getElementById("pp-"+p.id),g=document.getElementById("pg-"+p.id);
  const pct=Math.round(p.prog/p.w*100);
  if(b)b.style.width=clamp(pct,0,100)+"%";
  if(t)t.textContent=pct+"%";
  if(g){g.textContent=p.bugs;g.style.color=p.bugs>8?"var(--bad)":"var(--ink)";}
 });

/* ==================== РЕНДЕР: ЛЕВАЯ КОЛОНКА ==================== */
/* Полоски состояния меняются каждый кадр, поэтому живут в отдельном блоке:
   его перерисовывает liveUpdate, не трогая остальную колонку с кнопками. */
function needsHTML(){
 const n=S.needs;
 let h=bar("Энергия",n.energy)+bar("Сытость",n.food)+bar("Гигиена",n.hygiene)+bar("Настроение",n.mood)+bar("Здоровье",n.health);
 h+=`<div class="row"><span class="lbl">Выгорание</span><span class="bar burn"><i style="width:${clamp(S.burn,0,100)}%"></i></span><span class="val">${Math.round(S.burn)}</span></div>`;
 if(S.sick>0)h+=`<div class="hint" style="margin-top:4px"><span class="chip b">болеет</span> ещё ${S.sick} дн., всё идёт вязко</div>`;
 if(S.burn>70)h+=`<div class="hint" style="margin-top:4px"><span class="chip w">выгорание</span> отдых сейчас дешевле, чем потом</div>`;
 return h;
}
function renderStats(){
 const iss=issues(),hard=iss.filter(x=>x.hard);
 let h=`<h3 class="sec">Состояние</h3><div id="statNeeds">${needsHTML()}</div>`;

 h+=`<h3 class="sec mt">Навыки</h3>`;
 for(const k in SKILLS){
  if(k==="prompt"&&gYear()<2023&&S.sk.prompt<1)continue;
  h+=bar(SKILLS[k],S.sk[k],"sk");
 }
 h+=`<h3 class="sec mt">Имя</h3>`+bar("Репутация",S.rep,"sk");
 h+=`<dl class="kv" style="margin-top:6px">
  <dt>Подписчики</dt><dd>${S.followers.toLocaleString("ru-RU")}</dd>
  <dt>Сдано</dt><dd>${S.shipped}</dd>
  <dt>Заработано</dt><dd>${money(S.earned)}</dd>
  <dt>Состояние</dt><dd class="${netWorth()<0?"b":"g"}">${money(netWorth())}</dd></dl>`;

 h+=`<h3 class="sec mt">Машина</h3>`;
 if(hard.length){
  h+=`<div class="card badc"><div class="meta"><b style="color:var(--bad)">Не собрана</b><br>${hard.map(x=>x.m).join("<br>")}</div></div>`;
 }
 h+=`<dl class="kv">
  <dt>Мощность</dt><dd style="color:var(--acc)">${hard.length?"— не работает":power().toFixed(0)}</dd>

function slotCard(sl){
 const c=cur(sl),ci=HW[sl].items.indexOf(c);
 let h=`<div class="card"><h4>${HW[sl].L}</h4>
  <div class="srow cur"><span class="nm" style="color:var(--acc)">${c.n}${slotSpec(sl,c)}</span><span class="own">стоит</span></div>`;
 const shown=HW[sl].items.filter(it=>it.id!==c.id&&it.y<=gYear());
 shown.forEach(it=>{
  const bad=canInstall(sl,it.id);
  const price=hwPrice(it);
  const back=c.p?Math.round(c.p*.35):0;
  const aff=S.money>=price-back;
  let note="";
  if(bad)note=`<small class="no">${bad.k}: ${bad.m}</small>`;
  else if(!aff)note=`<small>не хватает ${money(price-back-S.money)}</small>`;
  h+=`<div class="srow"><span class="nm">${it.n}${slotSpec(sl,it)}${note}</span>
   ${B({act:"buyhw",a:sl,b:it.id,t:price?money(price):"бесплатно",cls:"tiny"+(!bad&&aff?" pri":""),dis:!!bad||!aff,ttl:bad?bad.m:""})}</div>`;
 });
 if(!shown.length)h+=`<div class="hint" style="padding:5px 2px">Ничего другого пока не выпустили.</div>`;
 return h+`</div>`;
}
function slotSpec(sl,it){
 const t=[];
 if(sl==="mb"){t.push(it.sock.map(x=>SOCKN[x]).join("/"),it.ram.map(x=>RAMT[x]).join("/"),it.bus.map(x=>BUSN[x]).join("/"),`${IFN[it.dmin]}–${IFN[it.dmax]}`,FORMN[it.form]);}
 if(sl==="cpu")t.push(SOCKN[it.sock],`${it.w} Вт`,`мощь ${it.pw}`);
 if(sl==="cooler")t.push(`держит ${it.tdp} Вт`);
 if(sl==="ram")t.push(RAMT[it.type],`мощь ${it.pw}`);
 if(sl==="gpu")t.push(BUSN[it.bus],`${it.w} Вт`,`${it.len} мм`,it.vr?`${it.vr} ГБ`:"без VRAM",["без доп. пит.","6/8-pin","2×8-pin","12VHPWR"][it.pg]);
 if(sl==="disk")t.push(IFN[it.if],`мощь ${it.pw}`);
 if(sl==="psu")t.push(`${it.w} Вт`,["без доп. разъёмов","6/8-pin","2×8-pin","12VHPWR"][it.pg]);
 if(sl==="case")t.push(`до ${FORMN[it.form]}`,`видео ${it.gpu} мм`,`продув ×${it.air}`);
 if(sl==="mon")t.push(`комфорт ${Math.round(it.cf*100)}%`,it.need?`нужна мощь видео ${it.need}`:"без требований");
 if(sl==="net")t.push(`${it.sp} усл. Мбит`,`${money(Math.round(it.fee*inf()/1.2))}/нед`);
 if(sl==="chair")t.push(`комфорт ${Math.round(it.cf*100)}%`,`здоровье ${it.hp>0?"+":""}${it.hp}/день`);
 if(sl==="kb")t.push(`комфорт ${Math.round(it.cf*100)}%`,`скорость ×${it.ty}`);
 return t.length?`<small>${t.join(" · ")}</small>`:"";
}

 });
 h+=`</div>`;

 h+=`<h3 class="sec mt">Ядро системы</h3><div class="grid2">`;
 CORE.forEach(sl=>h+=slotCard(sl));

 <b>Еда</b> — это статья расходов, а не кнопка. Сытость уходит примерно на 3 в час, и дешёвое всегда бьёт по здоровью: организм отыгрывает максимум 3 очка в сутки, так что на лапше ты уходишь в минус быстрее, чем восстанавливаешься.<br>
 <b>Выгорание</b> растёт от каждого рабочего часа и снижает всё сразу. Сон и прогулки его убирают понемногу, отпуск — сильно, но не до нуля.<br>
 Счета приходят каждые 7 дней: жильё, электричество по ваттам сборки, связь, подписки, мелочи. Налоги — каждые 28 дней с оборота.</div>`;
 return h;
}

/* ==================== ИГРОВОЙ ЦИКЛ ====================
   Время идёт само, пока не стоит пауза и пока событие не ждёт ответа.
   Шаг дробится на куски по 0.25 игрового часа, чтобы на ×8 не проскочить
   полночь, конец дела или момент, когда проект стал готов. */
let lastT=0,liveAcc=0,checkAcc=0;
function frame(now){
 requestAnimationFrame(frame);
 if(!lastT){lastT=now;return;}
 let dt=(now-lastT)/1000;lastT=now;
 /* Вкладку сворачивали: rAF стоял. Время не догоняем — это не идл-игра. */
 if(dt>.5)dt=.5;
 if(S.speed>0&&!S.pending){
  let h=dt*S.speed/SEC_HOUR,guard=0;
  while(h>1e-6&&guard++<64){
   const chunk=Math.min(h,.25);
   stepAct(chunk);h-=chunk;
   if(afterStep()||S.pending)break;
  }
  checkAcc+=dt;
  if(checkAcc>=1){checkAcc=0;check();}
 }
 if(needRender)render();
 else{liveAcc+=dt;if(liveAcc>=.1){liveAcc=0;liveUpdate();}}
}
/* Сохранение могло прийти с делом, которого больше нет */
function repair(){
 if(!S.act||typeof S.act!=="object")S.act={k:"idle"};
 if((S.act.k==="work"||S.act.k==="debug")&&!proj(S.act.id))S.act={k:"idle"};
 if(S.act.k==="timed"&&!TIMED[S.act.t])S.act={k:"idle"};
 if(S.speed!==0&&SPEEDS.indexOf(S.speed)<0)S.speed=1;
 if(typeof S.nextEv!=="number")scheduleEv();
 if(typeof S.aiAcc!=="number")S.aiAcc=0;
}

/* ==================== СТАРТ ==================== */
(async function init(){
 S=fresh();
 const r=await load();
 if(r){try{const o=JSON.parse(r);if(o.ver===VER)S=o;}catch(e){}}
 repair();
 if(!S.log.length){
  log("1998 год. У тебя 486-й на Socket 3, табуретка вместо кресла и модем, который работает только когда мама не звонит.","ev");
  log("Начни с мелких заказов на железе — они не требуют навыков, зато кормят. И помни: плата определяет, что вообще можно поставить.","");
  log("Время идёт само: выбери занятие, а скоростью управляй сверху — пробел ставит на паузу, клавиши 1–4 дают ×1/×2/×4/×8. Есть и спать никто за тебя не будет.","ev");
 }
 if(!S.offers.length)refreshOffers();
 render();
 syncHdr();
 const hd=document.querySelector(".hdr"),ab=document.querySelector(".actbar");
 if(window.ResizeObserver){
  const ro=new ResizeObserver(syncHdr);
  if(hd)ro.observe(hd); if(ab)ro.observe(ab);
 }else window.addEventListener("resize",syncHdr);
 /* Горячие клавиши времени: пробел — пауза/продолжить (возвращает на ту
    скорость, что была, а не на ×1), 1–4 — ×1/×2/×4/×8, 0 — пауза.
    Ctrl/Alt/Cmd не перехватываем: там живут переключения вкладок браузера. */
 document.addEventListener("keydown",e=>{
  const t=e.target.tagName;
  if(t==="TEXTAREA"||t==="INPUT"||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.code==="Space"){
   if(S.speed>0){lastSpeed=S.speed;S.speed=0;}else S.speed=lastSpeed||1;
  }else if(e.code==="Digit0"||e.code==="Numpad0"){
   if(S.speed>0)lastSpeed=S.speed;
   S.speed=0;
  }else{
   const m=/^(?:Digit|Numpad)([1-4])$/.exec(e.code);
   if(!m)return;
   S.speed=SPEEDS[+m[1]-1];lastSpeed=S.speed;
  }
  e.preventDefault();
  renderActBar();
 });
 requestAnimationFrame(frame);
})();
